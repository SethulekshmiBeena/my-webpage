<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════
  HOW TO PERSONALIZE THIS CARD
  ═══════════════════════════════════════════════════════════════
  Everything you need to change lives in ONE place: the `CARD`
  object near the top of the <script> at the bottom of this file
  (search for "const CARD ="). You don't need to touch any HTML
  or CSS. Just edit the text inside the quotes.

  - recipientName / senderName  → the names on the letter
  - lyrics                      → your birthday message, written as
                                   short lines like song lyrics. They
                                   play one at a time, Spotify-style.
  - photos                      → captions for the polaroid stack.
                                   To use REAL photos, replace the
                                   `img` value with a link to your
                                   photo (e.g. an Imgur link), or
                                   leave blank to keep the soft
                                   color placeholder.
  - notes                       → the little love notes hidden in
                                   the gift boxes
  - quiz                        → your "how well do you know us"
                                   questions. `correct` is the
                                   index (0, 1, 2...) of the right
                                   answer.
  - finalMessage                → the last line he sees

  When you're done editing, just send him this HTML file, or host
  it (e.g. upload it to Claude, Google Drive with link sharing,
  Netlify Drop, etc.) and send the link. Opening the file in any
  browser is all he needs to do.
  ═══════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A small gift to the love of my existence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;600;700&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight:#0B0F2E;
    --indigo:#141B4D;
    --royal-blue:#2B4FE0;
    --sky-blue:#5B8DEF;
    --red:#E8384F;
    --deep-red:#B01E33;
    --gold:#F2C879;
    --cream:#FBF3E4;
    --lavender:#B9A6DE;
    --ink:#2E2A3D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--midnight);
    color:var(--cream);
    font-family:'Mulish', sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  h1,h2,h3{font-family:'Playfair Display', serif; font-weight:600;}
  .script{font-family:'Caveat', cursive;}

  /* ---------- shared starfield (cosmic anime nebula) ---------- */
  #stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 50% at 15% 8%, rgba(217,70,168,.28) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 88% 18%, rgba(77,216,232,.22) 0%, transparent 55%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(43,79,224,.28) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 0%, #241246 0%, var(--midnight) 65%);
  }
  .star{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:var(--cream); opacity:.6;
    animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.9;} }
  .bokeh{
    position:absolute; border-radius:50%; pointer-events:none;
    animation:drift-float linear infinite, twinkle 2.8s ease-in-out infinite;
  }
  @keyframes drift-float{
    from{ transform:translateY(0); }
    to{ transform:translateY(-40px); }
  }
  .ray{
    position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(242,200,121,.18) 0%, transparent 70%);
    filter:blur(2px);
  }

  section{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:8vh 6vw;
  }

  .eyebrow{
    letter-spacing:.35em; text-transform:uppercase; font-size:.7rem;
    color:var(--sky-blue); margin-bottom:1.2rem;
  }

  /* ---------- envelope (paper craft) ---------- */
  #envelope-wrap{cursor:pointer; user-select:none; position:relative;}
  .halo{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(130vw, 560px); height:min(130vw, 560px);
    pointer-events:none; z-index:0;
  }
  .halo-ring{
    position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(232,56,79,.22), rgba(217,70,168,.2), rgba(242,200,121,.22), rgba(77,216,232,.2),
      rgba(43,79,224,.25), rgba(217,70,168,.2), rgba(232,56,79,.22));
    filter:blur(40px);
    animation:rotate-halo 16s linear infinite;
    opacity:.5;
  }
  @keyframes rotate-halo{ to{ transform:rotate(360deg); } }
  .halo-glow{
    position:absolute; inset:16%; border-radius:50%;
    background:radial-gradient(circle, rgba(251,243,228,.18) 0%, transparent 70%);
    animation:pulse-glow 3s ease-in-out infinite;
  }
  @keyframes pulse-glow{ 0%,100%{opacity:.5; transform:scale(1);} 50%{opacity:.9; transform:scale(1.06);} }

  .card-frame{
    position:relative; z-index:2;
    width:min(80vw, 310px);
    margin:0 auto;
  }

  .envelope{
    position:relative; width:78%; margin:0 auto; aspect-ratio:4/3;
    z-index:2; transform:rotate(-2deg);
    filter:drop-shadow(0 25px 40px rgba(0,0,0,.55));
  }
  .letter-peek{
    display:block;
    position:absolute; left:6%; right:6%; top:-38%; height:72%;
    background:linear-gradient(180deg, #f2e6c9 0%, #ecd9ad 100%);
    clip-path:polygon(
      3% 8%, 18% 2%, 34% 6%, 50% 0%, 66% 5%, 82% 1%, 97% 9%,
      100% 100%, 0% 100%
    );
    box-shadow:0 8px 20px rgba(0,0,0,.3);
    transform:rotate(-3deg);
    transform-origin:bottom center;
    transition:transform .8s cubic-bezier(.6,0,.2,1), top .8s cubic-bezier(.6,0,.2,1);
    z-index:1;
  }
  .letter-peek::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(150,90,40,.35) 0%, transparent 12%);
    mix-blend-mode:multiply;
  }
  .letter-lines{ position:absolute; top:16%; left:14%; right:10%; }
  .letter-lines span{
    display:block; height:2px; margin-bottom:9px; border-radius:2px;
    background:rgba(60,45,20,.28);
  }
  .letter-lines span:nth-child(1){ width:70%; }
  .letter-lines span:nth-child(2){ width:85%; }
  .letter-lines span:nth-child(3){ width:55%; }
  .letter-lines span:nth-child(4){ width:75%; }
  .letter-lines span:nth-child(5){ width:40%; }

  .env-back{
    position:absolute; inset:0; border-radius:3px;
    background:linear-gradient(155deg, #7a1c3a 0%, #4a1030 55%, #2a0d2e 100%);
    box-shadow:0 16px 30px rgba(0,0,0,.45), 0 0 30px rgba(232,56,79,.25);
    z-index:2;
  }
  .env-flap{
    position:absolute; top:-2%; left:0; right:0; height:82%;
    background:linear-gradient(160deg, #9c2444 0%, #601530 70%, #38102c 100%);
    clip-path:polygon(50% 100%, 0% 0%, 100% 0%);
    transform-origin:top center;
    transform:rotateX(0deg);
    transition:transform .9s cubic-bezier(.6,0,.2,1);
    box-shadow:inset 0 -6px 12px rgba(0,0,0,.25);
    z-index:3;
  }
  .envelope.open .env-flap{ transform:rotateX(200deg); }
  .envelope.open .letter-peek{ top:-62%; transform:rotate(-2deg); }

  .flowers{
    position:absolute; left:-16%; top:2%; width:56%; z-index:4;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));
  }
  .star-seal{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
    width:52px; height:52px; z-index:6;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.4)) drop-shadow(0 0 14px rgba(150,190,245,.65));
    animation:seal-twinkle 2.6s ease-in-out infinite;
    transition:opacity .4s ease, transform .4s ease;
  }
  @keyframes seal-twinkle{ 0%,100%{ filter:drop-shadow(0 4px 10px rgba(0,0,0,.4)) drop-shadow(0 0 14px rgba(150,190,245,.65));} 50%{ filter:drop-shadow(0 4px 10px rgba(0,0,0,.4)) drop-shadow(0 0 24px rgba(190,220,255,1));} }
  .envelope.open .star-seal{ opacity:0; transform:translate(-50%,-50%) scale(0); }

  .tap-hint{ margin-top:2.4rem; font-size:.95rem; color:var(--gold); letter-spacing:.05em; z-index:2; position:relative; }
  .tap-hint .pulse{ display:inline-block; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.5;} 50%{opacity:1;} }

  /* ---------- letter (Spotify-style lyrics) ---------- */
  #letter{
    background:linear-gradient(180deg, #0d1240 0%, #1a1050 55%, #2a0f2e 100%);
    color:var(--cream);
    opacity:0; transform:translateY(30px);
    transition:opacity .8s ease, transform .8s ease;
  }
  #letter.visible{ opacity:1; transform:translateY(0); }
  .player{
    width:min(90vw, 420px); display:flex; flex-direction:column; align-items:center;
  }
  .player-art{
    width:64px; height:64px; border-radius:8px; margin-bottom:1rem;
    background:linear-gradient(160deg, #2a2f5c 0%, #171b3d 60%, #0f1130 100%);
    border:1px solid rgba(91,141,239,.3);
    box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    display:flex; align-items:center; justify-content:center; font-size:1.4rem;
  }
  .player-meta{ font-size:.8rem; color:#b7b9d9; margin-bottom:.2rem; letter-spacing:.03em; }
  .player-title{ font-family:'Playfair Display'; font-size:1.3rem; margin-bottom:1.8rem; }
  .lyrics-box{
    width:100%; height:280px; overflow:hidden; position:relative;
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
    mask-image:linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
  }
  .lyrics-track{
    position:absolute; left:0; right:0; top:50%;
    transition:transform .7s cubic-bezier(.4,0,.2,1);
  }
  .lyric-line{
    font-family:'Caveat', cursive; font-size:1.55rem; line-height:1.5;
    color:#5c5f8f; padding:.5rem 0; transition:color .5s ease, transform .5s ease, opacity .5s ease;
    opacity:.5; transform:scale(.92);
  }
  .lyric-line.active{
    color:var(--cream); opacity:1; transform:scale(1);
    text-shadow:0 0 18px rgba(232,56,79,.35);
  }
  .lyric-line.past{ color:var(--sky-blue); opacity:.35; }
  .progress-row{ display:flex; align-items:center; gap:.6rem; width:100%; margin-top:1.4rem; }
  .progress-bar{ flex:1; height:4px; border-radius:4px; background:rgba(255,255,255,.15); overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--red), var(--royal-blue)); transition:width .6s linear; }
  .progress-time{ font-size:.7rem; color:#9497c4; min-width:32px; }
  .lyrics-controls{ margin-top:1.6rem; display:flex; align-items:center; gap:1.6rem; }
  .ctrl-btn{
    background:none; border:none; color:var(--cream); font-size:1.1rem; cursor:pointer; opacity:.85;
    transition:opacity .2s, transform .2s;
  }
  .ctrl-btn:hover{ opacity:1; transform:scale(1.1); }
  .ctrl-btn.play{
    width:46px; height:46px; border-radius:50%;
    background:linear-gradient(135deg, var(--red), var(--royal-blue));
    display:flex; align-items:center; justify-content:center; font-size:1.1rem;
  }
  #letter .sign{
    font-family:'Caveat', cursive; font-size:1.6rem; margin-top:1.8rem; color:var(--gold);
  }
  .scroll-cue{ margin-top:2.4rem; font-size:.85rem; color:#8285b3; letter-spacing:.1em; }

  /* ---------- photos ---------- */
  .stack{ position:relative; width:min(70vw, 280px); height:min(70vw, 280px); margin:2.5rem auto 0; }
  .polaroid{
    position:absolute; inset:0; background:var(--cream); border-radius:4px;
    padding:12px 12px 46px 12px; box-shadow:0 18px 40px rgba(0,0,0,.4);
    cursor:pointer; transition:transform .5s cubic-bezier(.6,0,.2,1), opacity .5s;
  }
  .polaroid .photo{
    width:100%; height:100%; border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.8rem;
  }
  .polaroid figcaption{
    font-family:'Caveat', cursive; color:var(--ink); font-size:1.15rem;
    position:absolute; bottom:10px; left:0; right:0;
  }
  .stack-hint{ margin-top:1.8rem; font-size:.85rem; color:var(--sky-blue); }

  /* ---------- gift notes ---------- */
  .box-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr));
    gap:1.4rem; max-width:520px; margin-top:2.5rem; width:100%;
  }
  .gift{
    position:relative; cursor:pointer; perspective:600px;
  }
  .gift-box{
    width:100%; aspect-ratio:1; border-radius:10px;
    background:linear-gradient(145deg,var(--red),var(--royal-blue));
    display:flex; align-items:center; justify-content:center;
    font-size:2rem; box-shadow:0 10px 24px rgba(0,0,0,.35);
    transition:transform .5s cubic-bezier(.6,0,.2,1), opacity .5s;
  }
  .gift.opened .gift-box{ transform:scale(0) rotate(20deg); opacity:0; }
  .note-card{
    position:absolute; inset:0; background:var(--cream); color:var(--ink);
    border-radius:10px; display:flex; align-items:center; justify-content:center;
    padding:.8rem; font-family:'Caveat', cursive; font-size:1.05rem; line-height:1.35;
    opacity:0; transform:scale(.7); pointer-events:none;
    transition:opacity .5s ease .15s, transform .5s cubic-bezier(.6,0,.2,1) .15s;
    box-shadow:0 10px 24px rgba(0,0,0,.35);
  }
  .gift.opened .note-card{ opacity:1; transform:scale(1); }

  /* ---------- quiz ---------- */
  #quiz-card{
    background:var(--cream); color:var(--ink); border-radius:16px;
    padding:2.2rem 1.8rem; max-width:460px; width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
  }
  #quiz-card h2{ font-size:1.4rem; margin-bottom:.3rem; }
  .quiz-progress{ font-size:.8rem; color:#9a8f95; margin-bottom:1.4rem; }
  #q-text{ font-size:1.15rem; margin-bottom:1.4rem; line-height:1.5; }
  .options{ display:flex; flex-direction:column; gap:.7rem; }
  .opt-btn{
    font-family:'Mulish', sans-serif; font-size:.98rem; text-align:left;
    padding:.8rem 1rem; border-radius:10px; border:2px solid #e6dccb;
    background:#fff; cursor:pointer; transition:.25s;
  }
  .opt-btn:hover{ border-color:var(--sky-blue); }
  .opt-btn.correct{ background:#dff3e0; border-color:#6cbf75; }
  .opt-btn.wrong{ background:#fbe1e1; border-color:#e08a8a; }
  .opt-btn[disabled]{ cursor:default; }
  .fact{ margin-top:1rem; font-size:.92rem; color:#7a6f75; font-style:italic; }
  .next-btn{
    margin-top:1.4rem; background:var(--ink); color:var(--cream); border:none;
    padding:.7rem 1.6rem; border-radius:30px; font-family:'Mulish'; cursor:pointer;
    font-size:.9rem; letter-spacing:.04em; display:none;
  }
  .next-btn.show{ display:inline-block; }
  #quiz-result{ display:none; }
  #quiz-result.show{ display:block; }
  #quiz-result .score{ font-family:'Playfair Display'; font-size:2.4rem; margin:.6rem 0; }

  /* ---------- finale ---------- */
  #finale{ gap:1.2rem; }
  .skyline{
    position:relative; width:min(90vw, 460px); height:180px; margin:1.5rem auto 0;
  }
  .window{
    position:absolute; bottom:0; width:70px; height:110px; background:var(--indigo);
    border:3px solid #4a4f7f; border-radius:6px 6px 0 0;
  }
  .window::before{
    content:''; position:absolute; inset:10px;
    opacity:.85; border-radius:2px;
    animation:glow 2.4s ease-in-out infinite;
  }
  .window.left::before{ background:var(--sky-blue); box-shadow:0 0 20px rgba(91,141,239,.7); }
  .window.right::before{ background:var(--red); box-shadow:0 0 20px rgba(232,56,79,.7); animation-delay:1.2s; }
  @keyframes glow{ 0%,100%{opacity:.55;} 50%{opacity:1;} }
  .window.left{ left:8%; }
  .window.right{ right:8%; }
  .thread{
    position:absolute; left:20%; right:20%; top:20px; height:2px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 6px, transparent 6px 14px);
  }
  .finale-msg{ max-width:480px; margin-top:2rem; font-size:clamp(1.1rem,3vw,1.4rem); line-height:1.7; }
  .heart-btn{ margin-top:2rem; font-size:2rem; background:none; border:none; cursor:pointer; }

  /* confetti */
  .confetti-piece{
    position:fixed; top:-10px; width:8px; height:14px; z-index:50;
    pointer-events:none; border-radius:2px;
  }
  @keyframes fall{
    to{ transform:translateY(100vh) rotate(540deg); opacity:0; }
  }
</style>
</head>
<body>

<div id="stars"></div>

<!-- ENVELOPE -->
<section id="intro">
  <div class="eyebrow">a letter for you from your wife</div>
  <div id="envelope-wrap">
    <div class="halo"><div class="halo-ring"></div><div class="halo-glow"></div></div>
    <div class="card-frame">
      <div class="card-paper">
        <div class="envelope" id="envelope">
          <div class="letter-peek">
            <div class="letter-lines">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
          <div class="env-back"></div>
          <div class="env-flap"></div>

          <svg class="flowers" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M60 138 C58 100 56 70 50 40" stroke="#4a6b4a" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M52 90 C40 84 30 86 22 78" stroke="#4a6b4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M56 60 C68 54 76 56 84 48" stroke="#4a6b4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <ellipse cx="22" cy="76" rx="10" ry="5" fill="#5a8a5a" transform="rotate(-30 22 76)"/>
            <ellipse cx="84" cy="47" rx="10" ry="5" fill="#5a8a5a" transform="rotate(25 84 47)"/>
            <ellipse cx="48" cy="100" rx="9" ry="5" fill="#5a8a5a" transform="rotate(-10 48 100)"/>

            <!-- orchid 1 -->
            <g transform="translate(48 36)">
              <ellipse cx="0" cy="-13" rx="7" ry="13" fill="#c99bd6" transform="rotate(0)"/>
              <ellipse cx="-12" cy="-4" rx="7" ry="13" fill="#b57fc9" transform="rotate(-45 -12 -4)"/>
              <ellipse cx="12" cy="-4" rx="7" ry="13" fill="#b57fc9" transform="rotate(45 12 -4)"/>
              <ellipse cx="-8" cy="9" rx="6" ry="11" fill="#9d5fb8" transform="rotate(-70 -8 9)"/>
              <ellipse cx="8" cy="9" rx="6" ry="11" fill="#9d5fb8" transform="rotate(70 8 9)"/>
              <path d="M0 -2 C-6 2 -6 10 0 13 C6 10 6 2 0 -2 Z" fill="#f2c879"/>
              <circle r="2.4" fill="#8a2140"/>
            </g>
            <!-- orchid 2 (smaller) -->
            <g transform="translate(20 74) scale(0.78)">
              <ellipse cx="0" cy="-13" rx="7" ry="13" fill="#d9aee0"/>
              <ellipse cx="-12" cy="-4" rx="7" ry="13" fill="#c489d1" transform="rotate(-45 -12 -4)"/>
              <ellipse cx="12" cy="-4" rx="7" ry="13" fill="#c489d1" transform="rotate(45 12 -4)"/>
              <ellipse cx="-8" cy="9" rx="6" ry="11" fill="#a868c2" transform="rotate(-70 -8 9)"/>
              <ellipse cx="8" cy="9" rx="6" ry="11" fill="#a868c2" transform="rotate(70 8 9)"/>
              <path d="M0 -2 C-6 2 -6 10 0 13 C6 10 6 2 0 -2 Z" fill="#f2c879"/>
              <circle r="2.4" fill="#8a2140"/>
            </g>
            <!-- orchid 3 (smaller, warmer) -->
            <g transform="translate(84 46) scale(0.7)">
              <ellipse cx="0" cy="-13" rx="7" ry="13" fill="#e0b8e6"/>
              <ellipse cx="-12" cy="-4" rx="7" ry="13" fill="#cf98da" transform="rotate(-45 -12 -4)"/>
              <ellipse cx="12" cy="-4" rx="7" ry="13" fill="#cf98da" transform="rotate(45 12 -4)"/>
              <ellipse cx="-8" cy="9" rx="6" ry="11" fill="#b378c9" transform="rotate(-70 -8 9)"/>
              <ellipse cx="8" cy="9" rx="6" ry="11" fill="#b378c9" transform="rotate(70 8 9)"/>
              <path d="M0 -2 C-6 2 -6 10 0 13 C6 10 6 2 0 -2 Z" fill="#f2c879"/>
              <circle r="2.4" fill="#8a2140"/>
            </g>
          </svg>

          <svg class="star-seal" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="starGrad" cx="40%" cy="35%" r="70%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="45%" stop-color="#bcd4f5"/>
                <stop offset="100%" stop-color="#5b8def"/>
              </radialGradient>
            </defs>
            <path d="M30 6 L36.5 23.5 L55 25 L40.5 36.5 L45 55 L30 44.5 L15 55 L19.5 36.5 L5 25 L23.5 23.5 Z"
                  fill="url(#starGrad)" stroke="#8fb3e8" stroke-width="1.2"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
  <div class="tap-hint"><span class="pulse">tap the envelope and smile to open it</span></div>
</section>

<!-- LETTER -->
<section id="letter">
  <div class="player">
    <div class="player-art">🎧</div>
    <div class="player-meta" id="letter-to">a song, written for you</div>

// ---- starfield ----
(function buildStars(){
  const wrap = document.getElementById('stars');
  const count = 90;
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.top = Math.random()*100 + '%';
    s.style.left = Math.random()*100 + '%';
    const size = Math.random()*2 + 1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.animationDelay = (Math.random()*3.5)+'s';
    wrap.appendChild(s);
  }
  // cosmic bokeh sparkles, matching the reference art's magenta/gold/cyan glow
  const bokehColors = ['rgba(217,70,168,.8)','rgba(242,200,121,.85)','rgba(77,216,232,.75)','rgba(232,56,79,.7)','rgba(43,79,224,.7)'];
  const bokehCount = 34;
  for(let i=0;i<bokehCount;i++){
    const b = document.createElement('div');
    b.className = 'bokeh';
    const size = Math.random()*6 + 3;
    const color = bokehColors[Math.floor(Math.random()*bokehColors.length)];
    b.style.width = size+'px';
    b.style.height = size+'px';
    b.style.top = Math.random()*100 + '%';
    b.style.left = Math.random()*100 + '%';
    b.style.background = color;
    b.style.boxShadow = `0 0 ${size*2.5}px ${color}`;
    b.style.animationDuration = `${6+Math.random()*8}s, ${2+Math.random()*2.5}s`;
    b.style.animationDelay = `-${Math.random()*6}s, -${Math.random()*3}s`;
    wrap.appendChild(b);
  }
})();

// ---- letter meta ----
document.getElementById('letter-to').textContent = CARD.letterTo;
document.getElementById('letter-sign').textContent = `${CARD.letterSign} ${CARD.senderName}`;
document.getElementById('finale-msg').textContent = CARD.finalMessage;

// ---- lyrics player ----
const LINE_MS = 2600; // how long each line stays on screen
const track = document.getElementById('lyrics-track');
const lineEls = [];
CARD.lyrics.forEach((line) => {
  const el = document.createElement('div');
  el.className = 'lyric-line';
  el.textContent = line;
  track.appendChild(el);
  lineEls.push(el);
});
const totalSeconds = Math.round((CARD.lyrics.length * LINE_MS) / 1000);
document.getElementById('total-time').textContent =
  `${Math.floor(totalSeconds/60)}:${String(totalSeconds%60).padStart(2,'0')}`;

let currentLine = 0;
let playing = false;
let timer = null;
const progressFill = document.getElementById('progress-fill');
const playBtn = document.getElementById('play-pause');

function renderLyricPositions(){
  const boxHeight = 280;
  const lineHeight = 56;
  track.style.transform = `translateY(${-(currentLine * lineHeight)}px)`;
  lineEls.forEach((el, i) => {
    el.classList.toggle('active', i === currentLine);
    el.classList.toggle('past', i < currentLine);
  });
  progressFill.style.width = `${(currentLine/(lineEls.length-1))*100}%`;
  const secs = Math.round((currentLine * LINE_MS)/1000);
  document.querySelector('.progress-time').textContent =
    `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
}
renderLyricPositions();

function advanceLine(){
  if(currentLine >= lineEls.length - 1){
    pausePlayback();
    return;
  }
  currentLine++;
  renderLyricPositions();
}
function playPlayback(){
  playing = true;
  playBtn.textContent = '⏸';
  timer = setInterval(advanceLine, LINE_MS);
}
function pausePlayback(){
  playing = false;
  playBtn.textContent = '▶';
  clearInterval(timer);
}
playBtn.addEventListener('click', () => playing ? pausePlayback() : playPlayback());
document.getElementById('next-line').addEventListener('click', () => {
  pausePlayback();
  currentLine = Math.min(currentLine + 1, lineEls.length - 1);
  renderLyricPositions();
});
document.getElementById('prev-line').addEventListener('click', () => {
  pausePlayback();
  currentLine = Math.max(currentLine - 1, 0);
  renderLyricPositions();
});
// autoplay once the letter becomes visible
const letterObserver = new MutationObserver(() => {
  if(document.getElementById('letter').classList.contains('visible') && !playing){
    setTimeout(playPlayback, 500);
  }
});
letterObserver.observe(document.getElementById('letter'), {attributes:true, attributeFilter:['class']});

// ---- envelope open ----
const envelope = document.getElementById('envelope');
const envelopeWrap = document.getElementById('envelope-wrap');
envelopeWrap.addEventListener('click', (e) => {
  if(envelope.classList.contains('open')) return;
  envelope.classList.add('open');
  const rect = envelope.getBoundingClientRect();
  burstConfetti(rect.left + rect.width/2, rect.top + rect.height/2);
  setTimeout(() => {
    document.getElementById('letter').classList.add('visible');
    document.getElementById('letter').scrollIntoView({behavior:'smooth'});
  }, 700);
});

// ---- confetti ----
function burstConfetti(x, y){
  const colors = ['#E8384F','#2B4FE0','#F2C879','#FBF3E4','#5B8DEF'];
  for(let i=0;i<26;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = x + (Math.random()*120-60) + 'px';
    p.style.top = y + 'px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    p.style.animation = `fall ${1.2+Math.random()*0.8}s ease-in forwards`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 2200);
  }
}

// ---- photo stack ----
const stack = document.getElementById('stack');
CARD.photos.forEach((p, i) => {
  const card = document.createElement('figure');
  card.className = 'polaroid';
  card.style.zIndex = CARD.photos.length - i;
  card.style.transform = `rotate(${(i%2===0?-1:1)*(3+i)}deg) translateY(${i*2}px)`;
  const photoStyle = p.img ? `background-image:url('${p.img}');background-size:cover;background-position:center;` : `background:${p.color};`;
  card.innerHTML = `<div class="photo" style="${photoStyle}">${p.img ? '' : '🤍'}</div><figcaption>${p.caption}</figcaption>`;
  stack.appendChild(card);
});
let topIndex = 0;
stack.addEventListener('click', () => {
  const cards = stack.children;
  const front = cards[topIndex];
  front.style.transition = 'transform .5s cubic-bezier(.6,0,.2,1), opacity .5s';
  front.style.transform = 'translateY(-140%) rotate(-12deg)';
  front.style.opacity = '0';
  setTimeout(() => {
    front.style.zIndex = 0;
    topIndex = (topIndex + 1) % cards.length;
    front.style.transition = 'none';
    front.style.opacity = '1';
    front.style.transform = `rotate(${(topIndex%2===0?-1:1)*3}deg)`;
    Array.from(cards).forEach((c,i) => {
      const rel = (i - topIndex + cards.length) % cards.length;
      c.style.zIndex = cards.length - rel;
    });
  }, 500);
});

// ---- gift notes ----
const boxGrid = document.getElementById('box-grid');
CARD.notes.forEach((note) => {
  const gift = document.createElement('div');
  gift.className = 'gift';
  gift.innerHTML = `<div class="gift-box">🎁</div><div class="note-card">${note}</div>`;
  gift.addEventListener('click', (e) => {
    if(gift.classList.contains('opened')) return;
    gift.classList.add('opened');
    const rect = gift.getBoundingClientRect();
    burstConfetti(rect.left + rect.width/2, rect.top);
  });
  boxGrid.appendChild(gift);
});

// ---- quiz ----
let qi = 0, score = 0;
const qText = document.getElementById('q-text');
const qOptions = document.getElementById('q-options');
const qFact = document.getElementById('q-fact');
const qProgress = document.getElementById('quiz-progress');
const nextBtn = document.getElementById('next-btn');

function renderQuestion(){
  const item = CARD.quiz[qi];
  qProgress.textContent = `question ${qi+1} of ${CARD.quiz.length}`;
  qText.textContent = item.q;
  qFact.textContent = '';
  nextBtn.classList.remove('show');
  qOptions.innerHTML = '';
  item.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => {
      Array.from(qOptions.children).forEach(b => b.disabled = true);
      if(idx === item.correct){
        btn.classList.add('correct');
        score++;
      } else {
        btn.classList.add('wrong');
        qOptions.children[item.correct].classList.add('correct');
      }
      qFact.textContent = item.fact;
      nextBtn.classList.add('show');
    });
    qOptions.appendChild(btn);
  });
}
nextBtn.addEventListener('click', () => {
  qi++;
  if(qi < CARD.quiz.length){
    renderQuestion();
  } else {
    document.getElementById('quiz-active').style.display = 'none';
    const result = document.getElementById('quiz-result');
    result.classList.add('show');
    document.getElementById('score-text').textContent = `${score} / ${CARD.quiz.length}`;
    const msg = score === CARD.quiz.length
      ? "look at you, paying attention this whole time 🤍"
      : "close enough — I'll forgive you, this time.";
    document.getElementById('score-msg').textContent = msg;
  }
});
renderQuestion();

// ---- finale heart ----
document.getElementById('heart-btn').addEventListener('click', (e) => {
  const rect = e.target.getBoundingClientRect();
  burstConfetti(rect.left, rect.top);
  e.target.textContent = e.target.textContent === '🤍' ? '❤️' : '🤍';
});
</script>
</body>
